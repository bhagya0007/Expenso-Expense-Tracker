version: '3.8'

services:
  parser-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expenso-parser-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
